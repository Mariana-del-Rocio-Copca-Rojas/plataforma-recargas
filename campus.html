<!doctype html>
<!--
  campus.html — Líneas de un campus (campus.html?id=…)
  Lógica: js/pages/campus.js
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus · EAV Recargas</title>
  <!-- Librerías (locales, funcionan sin internet) -->
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Estilos propios: tema → componentes -->
  <link href="css/base.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
</head>
<body>
  <!-- Barra superior: la pinta js/ui/navbar.js -->
  <div id="app-navbar"></div>

  <main class="container-fluid px-3 px-md-4 py-4">
    <!-- Migas de pan: Dashboard › Campus -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb small mb-2">
        <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
        <li class="breadcrumb-item active" id="crumbCampus">Campus</li>
      </ol>
    </nav>

    <!-- Encabezado: nombre del campus + botón -->
    <div class="d-flex flex-wrap justify-content-between align-items-center page-header mb-4">
      <div>
        <h1 class="h3 fw-bold mb-0" id="campusNombre">Cargando…</h1>
        <p class="text-muted mb-0" id="campusDireccion"></p>
      </div>
      <button class="btn btn-primary" id="btnNuevaLinea">
        <i class="bi bi-plus-lg me-1"></i>Registrar línea
      </button>
    </div>

    <!-- Tabla de líneas con búsqueda y filtro por estado -->
    <div class="card">
      <div class="card-header bg-white border-0 pt-3 d-flex flex-wrap gap-2 align-items-center">
        <div class="input-group" style="max-width:320px">
          <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
          <input type="search" class="form-control" id="buscar" placeholder="Buscar número, departamento…">
        </div>
        <select class="form-select w-auto" id="filtroEstado">
          <option value="">Todas</option>
          <option value="pendiente">Por recargar</option>
          <option value="vigente">Vigentes</option>
          <option value="suspendida">Suspendidas</option>
        </select>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>Número</th>
              <th>Compañía</th>
              <th>Departamento / uso</th>
              <th>Recarga habitual</th>
              <th>Última recarga</th>
              <th>Estado</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaLineas">
            <tr><td colspan="7" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal: registrar / editar línea -->
  <div class="modal fade" id="lineaModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
      <form class="modal-content" id="lineaForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="lineaModalTitulo">Registrar línea</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger py-2 small form-error d-none"></div>

          <h6 class="section-heading"><span class="number">1</span>Datos de la línea</h6>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label">Número telefónico (10 dígitos) <span class="required">*</span></label>
              <input class="form-control" name="numero" type="tel" inputmode="numeric" maxlength="10" placeholder="Ej. 2291234567" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Compañía <span class="required">*</span></label>
              <select class="form-select" name="compania" required>
                <option value="">Selecciona una compañía</option>
                <!-- Las demás opciones salen de CATALOGOS.COMPANIAS (js/config.js) -->
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Departamento <span class="required">*</span></label>
              <input class="form-control" name="departamento" maxlength="80" placeholder="Ej. Operaciones de vuelo, Control escolar" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Uso de la línea</label>
              <input class="form-control" name="uso" maxlength="100" placeholder="Ej. Celular del instructor de vuelo">
            </div>
            <div class="col-md-6">
              <label class="form-label">Estado</label>
              <select class="form-select" name="estado">
                <option value="activa">Activa</option>
                <option value="suspendida">Suspendida</option>
              </select>
            </div>
          </div>

          <h6 class="section-heading"><span class="number">2</span>Recarga habitual <small class="text-muted fw-normal ms-1">(se usa para prellenar cada recarga)</small></h6>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Monto</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" class="form-control" name="montoPlan" min="0" step="0.01" placeholder="0.00">
              </div>
            </div>
            <div class="col-md-4">
              <label class="form-label">Vigencia (días)</label>
              <input type="number" class="form-control" name="vigencia" min="0" step="1" placeholder="Ej. 30">
            </div>
            <div class="col-md-4">
              <label class="form-label">Paquete / tipo de recarga</label>
              <input class="form-control" name="paquete" maxlength="80" placeholder="Ej. Amigo Sin Límite 200">
            </div>
            <div class="col-12">
              <label class="form-label">Notas</label>
              <textarea class="form-control" name="notas" rows="2" maxlength="250"></textarea>
            </div>
          </div>
          <p class="small text-muted mt-3 mb-0">Los campos marcados con <span class="required">*</span> son obligatorios.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== Scripts (el orden importa: cada capa usa las anteriores) ===== -->
  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <!-- Configuración y núcleo -->
  <script src="js/config.js"></script>
  <script src="js/core/formato.js"></script>
  <script src="js/core/fechas.js"></script>
  <script src="js/core/session.js"></script>
  <!-- Capa de datos -->
  <script src="js/api/mock-store.js"></script>
  <script src="js/api/mock-api.js"></script>
  <script src="js/api/remote-api.js"></script>
  <script src="js/api/api.js"></script>
  <!-- Reglas de negocio -->
  <script src="js/domain/lineas.js"></script>
  <!-- Interfaz -->
  <script src="js/ui/notificaciones.js"></script>
  <script src="js/ui/formularios.js"></script>
  <script src="js/ui/navbar.js"></script>
  <script src="js/ui/badges.js"></script>
  <script src="js/ui/recarga-modal.js"></script>
  <!-- Página -->
  <script src="js/pages/campus.js"></script>
</body>
</html>
